[build]
builder = "nixpacks"
buildCommand = "npm run build"

[deploy]
# --accept-data-loss: adding the googleId unique column trips Prisma's data-loss guard
# in non-interactive deploys (existing values are all NULL, so nothing is actually lost)
startCommand = "npx prisma db push --accept-data-loss && npx tsx src/scripts/seedAdmin.ts && node dist/index.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environments.production]
PORT = "5000"
# sharp requires Node >= 20.9 — pin the runtime for the Nixpacks build and deploy
NODE_VERSION = "22.17.0"
NIXPACKS_NODE_VERSION = "22.17.0"
